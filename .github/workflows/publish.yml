name: publish

# Push a v* tag to test, build and upload to PyPI. PyPI trusts this workflow (trusted publishing), so no token is stored.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # lets uv publish prove to PyPI that this workflow is the trusted publisher
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv build
      - run: uv publish
