[project]
name = "warrantgen"
version = "0.0.1"
description = "Infer least-privilege Tenuo warrants from recorded agent tool calls"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["tenuo==0.3.2"]

[project.urls]
Repository = "https://github.com/RajanChavada/warrantgen"

[project.scripts]
warrantgen = "warrantgen.cli:main"

[project.optional-dependencies]
langchain = ["langchain-core>=0.3", "langgraph>=0.3"]

[dependency-groups]
dev = ["pytest", "langchain-core>=0.3", "langgraph>=0.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
