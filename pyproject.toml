[project]
name = "warrantgen"
version = "0.0.1"
description = "Infer least-privilege Tenuo warrants from recorded agent tool calls"
requires-python = ">=3.10"
dependencies = ["tenuo==0.3.2"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
